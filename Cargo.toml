[workspace]
resolver = "3"
members = [
    "crates/wm-proto",
    "crates/wm-control",
    "crates/wm-core",
    "crates/wm-ext",
    "crates/wm-tui",
    "crates/wm",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
authors = ["wired-magic"]

[workspace.dependencies]
wm-proto = { path = "crates/wm-proto" }
wm-core = { path = "crates/wm-core" }
wm-control = { path = "crates/wm-control" }
wm-ext = { path = "crates/wm-ext" }
wm-tui = { path = "crates/wm-tui" }

anyhow = "1"
argon2 = "0.5"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.9", features = ["tls-rustls-ring"] }
base64 = "0.22"
boringtun = "0.7.1"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
dashmap = "6"
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
futures-util = "0.3"
getrandom = "0.3"
hex = "0.4"
hostname = "0.4"
http = "1"
if-addrs = "0.15"
ipnet = { version = "2", features = ["serde"] }
libc = "0.2"
mime_guess = "2"
rand_core = { version = "0.6", features = ["getrandom"] }
ratatui = "0.30.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2", "charset"] }
rust-embed = "8.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "chrono"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
toml = "0.8"
tower = "0.5"
tower-http = { version = "0.7", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tun = { version = "0.8.14", features = ["async"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }

# Workaround for a rustc/macOS issue producing a malformed proc-macro dylib for
# sqlx-macros at opt-level=3 ("mis-aligned LINKEDIT string pool"). Proc macros
# run on the host at compile time, so optimizing them buys nothing.
[profile.release.package.sqlx-macros]
opt-level = 0
