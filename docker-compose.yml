# Deploy de um compose para Coolify (ou `docker compose up -d` numa VPS Linux).
#
# O Coolify cuida do TLS e do domínio: aponte o domínio para o serviço `wm` na
# porta interna WM_HTTP_PORT (padrão: 8080). As portas UDP saem direto porque o
# proxy HTTP não transporta STUN/WireGuard.
#
# Variáveis obrigatórias (configure no Coolify em Environment Variables, ou
# copie .env.example para .env num teste local):
#   WM_PUBLIC_URL      URL pública, sem :8080 — ex.: https://mesh.exemplo.com
#   WM_BOOTSTRAP_USERNAME / WM_BOOTSTRAP_PASSWORD  credencial temporária do setup
#   (obrigatórias apenas para volume novo; remova após concluir pela TUI)
#
# Opcional:
#   WM_NODE_NAME       nome do nó gateway no painel (padrão: gateway)
#   WM_HTTP_PORT       porta HTTP interna/proxy (padrão: 8080)
#   WM_STUN_PORT       porta STUN interna e externa UDP (padrão: 3478)
#   WM_UDP_PORT        porta WireGuard interna e externa UDP (padrão: 41641)

services:
  wm:
    build:
      context: .
      dockerfile: Dockerfile
      # BuildKit mantém caches Cargo no builder; não há etapa Node/React.
      # Sem cache_to/cache_from remoto ou dependência de docker compose watch.
      target: runtime
    restart: unless-stopped
    hostname: wired-magic

    # `wm host` sobe control plane + relay + STUN + o nó gateway .1. O data dir
    # é o volume; o control fica em /data/control e o agente em /data.
    command:
      - host
      - --public-url
      - ${WM_PUBLIC_URL:?defina WM_PUBLIC_URL com a URL publica, sem :8080}
      - --listen
      - 0.0.0.0:${WM_HTTP_PORT:-8080}
      - --stun-listen
      - 0.0.0.0:${WM_STUN_PORT:-3478}
      - --data-dir
      - /data
      - --udp-port
      - "${WM_UDP_PORT:-41641}"
      - --name
      - ${WM_NODE_NAME:-gateway}

    environment:
      WM_PUBLIC_URL: ${WM_PUBLIC_URL}
      WM_BOOTSTRAP_USERNAME: ${WM_BOOTSTRAP_USERNAME:-}
      WM_BOOTSTRAP_PASSWORD: ${WM_BOOTSTRAP_PASSWORD:-}
      WM_DATA_DIR: /data
      WM_LOG: ${WM_LOG:-info}

    # O proxy do Coolify deve usar WM_HTTP_PORT pela rede interna; não publicamos
    # HTTP puro. UDP usa a mesma porta interna/externa para não anunciar porta errada.
    expose:
      - "${WM_HTTP_PORT:-8080}"
    ports:
      - "${WM_STUN_PORT:-3478}:${WM_STUN_PORT:-3478}/udp" # STUN
      - "${WM_UDP_PORT:-41641}:${WM_UDP_PORT:-41641}/udp" # WireGuard do gateway

    volumes:
      - wm-data:/data

    # Necessário para criar a interface TUN e instalar rotas dentro do container.
    # Sem /dev/net/tun no host, o agente não sobe; veja docs/DEPLOY-COOLIFY.md.
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:${WM_HTTP_PORT:-8080}/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    # SIGINT faz o `wm host` encerrar o control com o shutdown gracioso.
    stop_signal: SIGINT
    stop_grace_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  wm-data:
