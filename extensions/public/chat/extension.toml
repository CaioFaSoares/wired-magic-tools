# Extensão pública: chat (TUI).
#
# O chat padrão é a TUI embutida no binário `wm`:
#
#   wm chat --url http://10.66.0.x:8790
#
# Ela conversa com o servidor `chat_gui` (a outra extensão) pela mesma API HTTP
# usada pelo painel web. Esta extensão não tem sidecar: o manifesto documenta o
# pacote TUI no catálogo e o gerenciador de pacotes pode distribuí-lo.
id = "chat"
name = "Chat público (TUI)"
version = "0.1.0"
description = "Cliente de chat no terminal; conecta em um servidor chat_gui pela malha, usando uma única porta HTTP."
author = "wired-magic"
homepage = "https://github.com/CaioFaSoares/wired-magic-tools/tree/main/extensions/public/chat"
visibility = "public"
node_driver = "none"
ui = "generic"
default_active = false

# Aba própria na TUI principal. Ao ativar/abrir a aba, o `wm tui` suspende a
# interface e executa `wm chat` no terminal; ao sair, volta para a TUI.
[tui]
tab = "Chat"
# TUI embutida via PTY: a extensão implementa a própria interface (aqui,
# `wm chat`) e o wm só fornece o terminal, o redimensionamento e as teclas.
mode = "pane"
command = "{wm}"
args = ["chat", "--url", "{option:url}"]
refresh_secs = 1
options = { url = "http://127.0.0.1:8790" }
