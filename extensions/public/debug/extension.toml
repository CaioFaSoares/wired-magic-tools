# Extensão pública: debug (TUI).
#
# O debug padrão é a TUI embutida no binário `wm`:
#
#   wm debug              # dashboard local de performance
#   wm debug discover     # descobre extensões locais (debug-discover)
#
# O painel web equivalente é a extensão `debug_gui`. Esta extensão não tem
# sidecar: o manifesto documenta o pacote TUI no catálogo.
id = "debug"
name = "Debug (TUI)"
version = "0.1.0"
description = "Dashboard de performance no terminal: CPU, memória, load, processo wm, top processos e descoberta de extensões locais."
author = "wired-magic"
homepage = "https://github.com/CaioFaSoares/wired-magic-tools/tree/main/extensions/public/debug"
visibility = "public"
node_driver = "none"
ui = "generic"
default_active = false

# Aba própria na TUI principal: executa o dashboard local `wm debug`.
[tui]
tab = "Debug"
mode = "exec"
command = "{wm}"
args = ["debug"]
refresh_secs = 2
